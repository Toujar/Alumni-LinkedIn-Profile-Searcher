version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: alumni_postgres
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-alumnidb}
      POSTGRES_USER:     ${POSTGRES_USER:-alumniuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alumnipass}
    ports:
      - "5432:5432"
    volumes:
      - alumni_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alumniuser} -d ${POSTGRES_DB:-alumnidb}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  alumni_pg_data:
