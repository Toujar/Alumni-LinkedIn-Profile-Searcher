# =============================================================================
# Test profile — used by @SpringBootTest and @WebMvcTest slice tests
# =============================================================================
# H2 in-memory database replaces PostgreSQL so tests run without any
# external infrastructure. Flyway is disabled; Hibernate creates the schema
# directly from entity definitions.
# =============================================================================

# --- DataSource (H2 in-memory) ------------------------------------------------
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# --- JPA / Hibernate ----------------------------------------------------------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# --- Flyway -------------------------------------------------------------------
# Flyway is disabled for tests; Hibernate manages the schema instead
spring.flyway.enabled=false

# --- PhantomBuster (stub values — client is always mocked in tests) -----------
phantombuster.api-key=test-api-key
phantombuster.base-url=http://localhost:9999
phantombuster.agent-id=test-agent-id
phantombuster.poll-interval-ms=100
phantombuster.poll-max-attempts=3
