# =============================================================================
# Alumni LinkedIn Profile Searcher — Application Configuration
# =============================================================================
# All sensitive values are resolved from environment variables.
# Copy .env.example to .env and fill in real values for local development.
# Never commit .env or any file containing real credentials.
# =============================================================================

# --- Server -------------------------------------------------------------------
server.port=8080

# --- DataSource (PostgreSQL) --------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ----------------------------------------------------------
# validate: Hibernate checks the schema matches entities but does NOT alter it.
# Schema creation is handled exclusively by Flyway migrations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Flyway -------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# --- PhantomBuster ------------------------------------------------------------
phantombuster.api-key=${PHANTOMBUSTER_API_KEY}
phantombuster.base-url=${PHANTOMBUSTER_BASE_URL:https://api.phantombuster.com/api/v2}
phantombuster.agent-id=${PHANTOMBUSTER_AGENT_ID}
# Milliseconds to wait between polling attempts (default: 3000)
phantombuster.poll-interval-ms=${PHANTOMBUSTER_POLL_INTERVAL_MS:3000}
# Maximum number of polling attempts before timeout (default: 20 → ~60 s)
phantombuster.poll-max-attempts=${PHANTOMBUSTER_POLL_MAX_ATTEMPTS:20}

# --- Logging ------------------------------------------------------------------
logging.level.com.example.alumni=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
